name: Precarga caché delaroca.es

on:
  schedule:
    # GitHub suele arrancar los programados con horas de retraso, por eso se lanza
    # dos veces por la noche. La segunda pasada es rápida si la caché sigue llena.
    - cron: "17 21 * * *"   # 22:17 en Madrid (invierno)
    - cron: "7 5 * * *"     # 06:07 en Madrid (invierno), después del vaciado nocturno del servidor (~03:40-04:40)
  workflow_dispatch:        # permite lanzarlo a mano desde GitHub

concurrency:
  group: precarga
  cancel-in-progress: false

jobs:
  precarga:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Visitar todas las páginas del sitemap y las páginas siguientes de los listados
        run: bash precargar.sh
