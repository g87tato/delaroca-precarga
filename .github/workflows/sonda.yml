name: Sonda caché delaroca.es

on:
  schedule:
    - cron: "23 * * * *"   # cada hora (GitHub puede retrasarla)
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar cuántas páginas siguen en caché
        run: bash sonda.sh
